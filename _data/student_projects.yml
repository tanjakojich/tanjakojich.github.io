# Student project clips, shown in the gallery at the bottom of /teaching/.
# Files go in /images/teaching/: <src>.mp4 plus a <src>.jpg poster.
# Clips match /images/research/: H.264, no audio, ~10–12 s, 600x338, 20 fps.
# Optional per clip: ratio ("16/9" default, "1/1", "4/3", …).
# An entry without src shows a "clip coming soon" placeholder.
# The gallery is hidden when this list is empty.
#
# Example:
# - src: yoga-vr
#   title: "Yoga Reimagined"
#   context: "Study Project Quality & Usability"
#   year: "2024"
#   alt: "A student practising a yoga pose next to a virtual instructor in VR"


